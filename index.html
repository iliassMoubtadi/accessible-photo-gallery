<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discover Morocco - Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <header>
        <h1>Discover Morocco 🇲🇦</h1>
        <p>Explore the beauty of Morocco through pictures.</p>
    </header>

    <main>
        <h2>Morocco Photo Gallery</h2>

        <div class="gallery">

            <figure>
                <img src="https://images.unsplash.com/photo-1539020140153-e479b8c22e70"
                    alt="Beautiful blue streets of Chefchaouen">
                <figcaption>Chefchaouen</figcaption>
            </figure>

            <figure>
                <img src="https://images.unsplash.com/photo-1489749798305-4fea3ae63d43"
                    alt="Traditional architecture in Morocco">
                <figcaption>Marrakech</figcaption>
            </figure>

            <figure>
                <img src="https://images.unsplash.com/photo-1509316785289-025f5b846b35"
                    alt="Golden sand dunes in the Sahara Desert">
                <figcaption>Sahara Desert</figcaption>
            </figure>

            <figure>
                <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b"
                    alt="Beautiful mountain landscape">
                <figcaption>Atlas Mountains</figcaption>
            </figure>

        </div>
    </main>

    <footer>
        <p>© 2026 Discover Morocco</p>
    </footer>

</body>

</html>
